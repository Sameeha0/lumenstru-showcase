<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumenstru AI Showcase</title>
<!--
  Lumenstru showcase - 4 made up students, click one to see the app on their phone.
  separate from the FYP code. colours/fonts/layout copied from the android app.
  scripts are in js/
-->
<style>
@font-face { font-family: 'Lora'; font-weight: 500; font-style: normal; src: url('assets/fonts/lora_medium.ttf') format('truetype'); }
@font-face { font-family: 'Lora'; font-weight: 600; font-style: normal; src: url('assets/fonts/lora_semibold.ttf') format('truetype'); }
@font-face { font-family: 'Lora'; font-weight: 500; font-style: italic; src: url('assets/fonts/lora_medium_italic.ttf') format('truetype'); }
@font-face { font-family: 'DM Sans'; font-weight: 400; src: url('assets/fonts/dm_sans_regular.ttf') format('truetype'); }
@font-face { font-family: 'DM Sans'; font-weight: 500; src: url('assets/fonts/dm_sans_medium.ttf') format('truetype'); }
@font-face { font-family: 'DM Sans'; font-weight: 600; src: url('assets/fonts/dm_sans_semibold.ttf') format('truetype'); }
@font-face { font-family: 'DM Sans'; font-weight: 700 800; src: url('assets/fonts/dm_sans_bold.ttf') format('truetype'); }

/* Colours from ui/theme/Color.kt. Matcha = light, Lavender = dark.
   The whole page follows the phone's mode so the two are never mixed. */
:root {
  --bg: #FBF9F6;
  --paper: #F2EFE9;
  --paper-raised: #F6F3EE;
  --primary: #5A7156;
  --primary-deep: #3A4C37;
  --primary-light: #E5EAE1;
  --accent: #E5A99E;
  --accent-deep: #8A4A3F;
  --accent-light: #F2D8D2;
  --ink: #1C221B;
  --ink2: #353D34;
  --muted: #575F56;
  --inactive: #D5D8CF;
  --line: rgba(42, 50, 41, 0.12);
  --line-strong: rgba(42, 50, 41, 0.24);
  --on-brand: #FBF9F6;
  --on-accent: #1C221B;
  --high-bg: #5A7156; --high-fg: #FBF9F6;
  --med-bg: #F3EDE2;  --med-fg: #6F5530;
  --low-bg: #E5EAE1;  --low-fg: #3A4C37;
  /* moving background (AmbientBackground.kt) */
  --blob-paper: rgba(242, 239, 233, 0.95);
  --blob-a: rgba(90, 113, 86, 0.30);
  --blob-b: rgba(229, 169, 158, 0.38);
  --bezel: #2A3229;
  --serif: "Lora", Georgia, serif;
  --sans: "DM Sans", "Segoe UI", Arial, sans-serif;
}
:root[data-mode="lavender"] {
  --bg: #0B1325;
  --paper: #182238;
  --paper-raised: #111A2E;
  --primary: #C3B5E3;
  --primary-deep: #DCD2F2;
  --primary-light: #222C45;
  --accent: #C3B5E3;
  --accent-deep: #DCD2F2;
  --accent-light: #2A3350;
  --ink: #EAEFF8;
  --ink2: #D3D9E6;
  --muted: #A6AFC8;
  --inactive: #4E5978;
  --line: rgba(195, 181, 227, 0.14);
  --line-strong: #4E5978;
  --on-brand: #0B1325;
  --on-accent: #0B1325;
  --high-bg: #2E2A4A; --high-fg: #DCD2F2;
  --med-bg: #242E48;  --med-fg: #C3B5E3;
  --low-bg: #1D263D;  --low-fg: #9EA8C4;
  --blob-paper: rgba(24, 34, 56, 0.95);
  --blob-a: rgba(195, 181, 227, 0.30);
  --blob-b: rgba(195, 181, 227, 0.20);
  --bezel: #182238;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  padding-inline: 16px;
  transition: background 0.5s, color 0.5s;
}
h1, h2, h3 { font-family: var(--serif); font-weight: 500; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
img { display: block; }

/* the page around the phone */
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 48px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 24px; font-weight: 500; background: none; border: 0; cursor: pointer; padding: 0; }
.brand i { color: var(--primary); }
.back { border: 1px solid var(--line-strong); background: transparent; color: var(--primary-deep); border-radius: 999px; height: 38px; padding: 0 16px; font-weight: 600; font-size: 13px; cursor: pointer; }

.intro { display: flex; gap: 28px; align-items: center; margin: 40px 0 28px; flex-wrap: wrap; }
.intro .text { flex: 1; min-width: 260px; max-width: 620px; }
.intro .over { font-size: 10px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
.intro h1 { font-size: clamp(32px, 5vw, 46px); line-height: 1.1; letter-spacing: -0.5px; margin-top: 6px; }
.intro h1 i { color: var(--primary); }
.intro p { color: var(--ink2); margin-top: 14px; font-size: 16px; }
.intro img { width: 150px; height: 150px; animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px); } }

.profiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.pcard { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 26px; padding: 17px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; transition: transform 0.18s cubic-bezier(.23,1,.32,1), border-color 0.2s; }
.pcard:hover { border-color: var(--primary); }
.pcard:active { transform: scale(0.98); }
.pcard .who { display: flex; gap: 12px; align-items: center; }
.mood-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--primary-light); display: grid; place-items: center; flex-shrink: 0; }
.mood-avatar img { width: 54px; height: 54px; }
.pcard h2 { font-size: 22px; }
.pcard .stage { font-size: 12.5px; color: var(--muted); }
.pcard .blurb { font-size: 14px; color: var(--ink2); }
.pcard .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.tag { font-size: 11px; font-weight: 600; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px 10px; color: var(--ink2); }
.tag.period { border-color: var(--accent); color: var(--accent-deep); }
.pcard .open { font-weight: 700; color: var(--primary-deep); font-size: 14px; }
.footnote { margin-top: 28px; font-size: 12.5px; color: var(--muted); }

.view { display: grid; grid-template-columns: 1fr 392px; gap: 48px; margin-top: 28px; align-items: start; }
.view > * { min-width: 0; }
.story { padding-top: 8px; }
/* the phone stays in view while the page scrolls */
.phone-wrap { position: sticky; top: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.phone-hint { font-size: 12px; color: var(--muted); text-align: center; }
/* drawn portrait with the mood mascot as a little badge */
.photo { position: relative; flex-shrink: 0; display: block; }
.photo svg { display: block; }
.badge-mascot { position: absolute; right: -6px; bottom: -4px; background: var(--paper); border: 1px solid var(--line); border-radius: 50%; padding: 2px; }
.switcher svg { flex-shrink: 0; }
.story .who { display: flex; gap: 14px; align-items: center; }
.story .mood-avatar { width: 76px; height: 76px; }
.story .mood-avatar img { width: 64px; height: 64px; }
.story h1 { font-size: 34px; line-height: 1.1; }
.story .stage { color: var(--muted); font-size: 14px; }
.story .quote { font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.45; color: var(--ink2); margin: 24px 0; padding-left: 16px; border-left: 2px solid var(--accent); }
.story h3 { font-size: 19px; margin-bottom: 4px; }
.helps { list-style: none; padding: 0; margin: 0; }
.helps li { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 14px 0; border-top: 1px solid var(--line); }
.helps li b { font-family: var(--serif); font-weight: 500; font-size: 22px; line-height: 1.1; color: var(--primary); }
.helps li strong { display: block; font-weight: 600; }
.helps li span { color: var(--ink2); font-size: 14px; }
.try { margin-top: 16px; font-size: 13px; color: var(--muted); }
.switcher { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
.switcher button { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px 3px 3px; cursor: pointer; font-size: 13px; }
.switcher button.on { border-color: var(--primary); color: var(--primary-deep); font-weight: 700; }
.switcher img { width: 28px; height: 28px; }

/* the phone */
.phone { width: 392px; height: 832px; border: 10px solid var(--bezel); border-radius: 48px; background: var(--bg); position: relative; overflow: hidden; display: flex; flex-direction: column; transition: background 0.5s, border-color 0.5s; }
.camera { position: absolute; top: 9px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #0E0E0E; z-index: 6; }
.statusbar { display: flex; justify-content: space-between; align-items: center; height: 30px; padding: 0 20px; font-size: 12px; font-weight: 600; position: relative; z-index: 2; }
.statusbar svg { width: 14px; height: 14px; vertical-align: -2px; }

/* AmbientBackground.kt: soft blobs on slow circular paths, one loop = 7 s */
.ambient { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.orbit { position: absolute; width: 0; height: 0; animation: orbit 7s linear infinite; }
.orbit.rev { animation-direction: reverse; }
.orbit i { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
@keyframes orbit { to { transform: rotate(360deg); } }

/* min-height: 0 lets the screen scroll inside the phone instead of growing */
.screen { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 1; scrollbar-width: none; }
.screen > * { flex-shrink: 0; }
.phone { user-select: none; -webkit-user-select: none; }
.phone input, .phone textarea { user-select: text; -webkit-user-select: text; }
.screen.dash { gap: 18px; }
.screen::-webkit-scrollbar { display: none; }

/* LumenstruBottomBar.kt */
.tabbar { display: flex; background: var(--paper-raised); height: 78px; padding: 0 8px; position: relative; z-index: 2; }
.tabbar button { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 500; line-height: 14px; }
.tabbar button.on { color: var(--primary-deep); }
.tabbar .tdot { height: 10px; display: grid; place-items: center; }
.tabbar .tdot span { width: 4px; height: 4px; border-radius: 50%; background: var(--primary); }
.tabbar svg { width: 17px; height: 17px; margin-top: 2px; }
.tabbar .tlabel { margin-top: 3px; }
.gesture { height: 16px; background: var(--paper-raised); display: grid; place-items: center; position: relative; z-index: 2; }
.gesture span { width: 108px; height: 4px; border-radius: 4px; background: var(--ink); opacity: 0.45; }

/* app type scale (Type.kt) */
.title { font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 32px; letter-spacing: -0.3px; }
.overline { font-size: 10px; font-weight: 600; line-height: 14px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
.caption-serif { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 14px; line-height: 18px; }
.t-med { font-size: 15px; font-weight: 600; line-height: 20px; }
.t-small { font-size: 13px; font-weight: 600; line-height: 18px; }
.b-med { font-size: 14px; line-height: 20px; }
.b-small { font-size: 12.5px; line-height: 17px; }
.l-large { font-size: 14px; font-weight: 600; line-height: 18px; letter-spacing: 0.2px; }
.l-med { font-size: 12px; font-weight: 500; line-height: 16px; }
.l-small { font-size: 11px; font-weight: 500; line-height: 14px; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink2); }
.deep { color: var(--primary-deep); }
.row { display: flex; align-items: center; }
.grow { flex: 1; min-width: 0; }
.center-self { align-self: center; }

/* app components */
/* ScreenHeader + IconCircleButton */
.header { display: flex; align-items: center; justify-content: space-between; }
.header .grow { padding-right: 8px; }
.iconbtn { position: relative; width: 44px; height: 44px; border: 0; padding: 0; background: none; cursor: pointer; flex-shrink: 0; }
.iconbtn .circle { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-light); color: var(--primary-deep); display: grid; place-items: center; }
.iconbtn svg { width: 17px; height: 17px; }
.iconbtn .dot { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }

/* LumenstruCard */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 26px; padding: 17px; display: flex; flex-direction: column; }
.card.click { cursor: pointer; transition: transform 0.15s; }
.card.click:active { transform: scale(0.98); }
.hairline { height: 1px; background: var(--line); }

/* PrimaryButton / GhostButton */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 17px; border-radius: 999px; border: 0; background: var(--primary); color: var(--on-brand); font-size: 14px; font-weight: 600; letter-spacing: 0.2px; cursor: pointer; transition: transform 0.15s; flex-shrink: 0; }
.btn svg { width: 16px; height: 16px; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--primary-deep); padding: 0 14px; }
.btn.small { height: 38px; padding: 0 13px; font-size: 12px; font-weight: 500; letter-spacing: 0; gap: 6px; }
.btn.small svg { width: 14px; height: 14px; }
.btn:active { transform: scale(0.97); }
.textbtn { border: 0; background: none; color: var(--primary-deep); font-size: 14px; font-weight: 700; cursor: pointer; padding: 8px 12px; border-radius: 999px; }

/* SectionLabel */
.section { display: flex; align-items: center; gap: 7px; color: var(--primary-deep); font-size: 10px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; }
.section svg { width: 15px; height: 11px; flex-shrink: 0; }
.section .rule { flex: 1; height: 1px; background: linear-gradient(90deg, color-mix(in srgb, var(--primary) 30%, transparent), transparent); }
.section.faded { opacity: 0.5; }

/* cycle ring */
.ring { position: relative; width: 236px; height: 236px; margin-top: 6px; align-self: center; flex-shrink: 0; }
.ring svg { position: absolute; inset: 0; }
.ring .inside { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring .big { font-family: var(--serif); font-weight: 500; font-size: 56px; line-height: 60px; letter-spacing: -1px; }
.ring .phase { width: 150px; color: var(--accent-deep); }
:root[data-mode="lavender"] .ring .phase { color: var(--primary-deep); }

/* QuickLogButton */
.quicklog { display: flex; align-items: center; gap: 14px; min-height: 64px; width: 100%; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-brand); padding: 8px 22px 8px 8px; text-align: left; cursor: pointer; transition: transform 0.15s; flex-shrink: 0; }
.quicklog:active { transform: scale(0.98); }
.quicklog .plus { width: 48px; height: 48px; border-radius: 50%; background: color-mix(in srgb, var(--on-brand) 16%, transparent); display: grid; place-items: center; }
.quicklog .plus svg { width: 20px; height: 20px; }
.quicklog .sub { opacity: 0.78; }

/* CheckInCard */
.mood-grid { display: flex; gap: 6px; margin-top: 12px; }
.pick { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; font-size: 10px; color: var(--ink2); }
.pick img { width: 40px; height: 40px; }
.pick.on { background: var(--primary-light); border-color: var(--primary); }
.energy { display: flex; gap: 8px; }
.energy .pick { padding: 10px 0; font-size: 12.5px; font-weight: 700; color: var(--ink); }
.battery { display: flex; gap: 3px; margin-bottom: 4px; }
.battery span { width: 10px; height: 14px; border-radius: 2px; background: var(--inactive); }
.battery span.on { background: var(--primary); }

/* PlanChangedCard */
.plan { background: var(--primary-light); border: 1px solid var(--primary); border-radius: 18px; padding: 16px; }
.plan .move { display: flex; align-items: center; padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); }
.plan .move .grow { padding-right: 10px; }
.plan .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dopill { border-radius: 999px; background: var(--primary-light); color: var(--primary-deep); padding: 6px 12px; white-space: nowrap; filter: brightness(0.96); }

/* QuickTile */
.tiles { display: flex; gap: 4px; }
.tile { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; padding: 8px 0; cursor: pointer; border-radius: 18px; }
.tile .circle { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--primary-deep); }
.tile svg { width: 20px; height: 20px; }
.tile span { margin-top: 8px; font-size: 12px; font-weight: 500; line-height: 16px; color: var(--ink2); text-align: center; }

/* TodayClassesCard */
.class-row { display: flex; gap: 14px; padding: 9px 0; align-items: baseline; }
.class-row .time { width: 96px; flex-shrink: 0; }
.class-row .time b { display: block; font-family: var(--serif); font-weight: 500; font-size: 18px; line-height: 24px; letter-spacing: -0.3px; }

/* StudyForecastCard */
.bars { display: flex; gap: 4px; align-items: flex-end; margin-top: 14px; }
.fbar { flex: 1; display: flex; flex-direction: column; align-items: center; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 8px; }
.fbar .slot { height: 76px; display: flex; align-items: flex-end; }
.fbar .pill { width: 14px; border-radius: 9px; }
.fbar.sel .pill { width: 18px; }
.fbar .letter { font-size: 11px; line-height: 17px; color: var(--ink2); margin-top: 6px; }
.fbar.sel .letter, .fbar.today .letter { font-weight: 700; color: var(--ink); }
.fbar .under { width: 12px; height: 2px; margin-top: 2px; }
.fbar.sel .under { background: var(--ink); }
.fbar .dl { height: 14px; display: grid; place-items: center; }
.fbar .dl span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.fbar .dl span.clash { width: 8px; height: 8px; background: var(--accent-deep); }
.legend { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.legend i.dot { width: 6px; height: 6px; border-radius: 50%; }
.tip { margin-top: 10px; border-radius: 12px; background: var(--primary-light); padding: 12px; font-size: 14px; line-height: 20px; }

/* StatsLedger */
.ledger { display: flex; height: 86px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); align-items: center; }
.stat { flex: 1; height: 100%; padding-top: 14px; text-align: center; }
.stat b { display: block; font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 34px; }
.stat span { display: block; margin-top: 2px; font-size: 9px; font-weight: 600; letter-spacing: 1.6px; color: var(--muted); }
.vline { width: 1px; height: 50%; background: var(--line); }

/* TaskGroup / TaskRow */
.group { background: var(--paper); border: 1px solid var(--line); border-radius: 26px; overflow: hidden; flex-shrink: 0; }
.group .sep { height: 1px; background: var(--line); margin-left: 54px; }
.task { display: flex; align-items: center; gap: 4px; padding: 12px 14px; cursor: pointer; }
.check { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; padding: 0; cursor: pointer; flex-shrink: 0; }
.check span { width: 22px; height: 22px; border-radius: 8px; border: 1.8px solid color-mix(in srgb, var(--primary) 62%, transparent); display: grid; place-items: center; transition: background 0.15s, border-color 0.15s, transform 0.15s; }
.check:active span { transform: scale(0.95); }
.check svg { width: 13px; height: 13px; color: var(--on-brand); opacity: 0; transition: opacity 0.18s; }
.task.done .check span { background: var(--primary); border-color: var(--primary); }
.task.done .check svg { opacity: 1; }
.tname { font-weight: 700; font-size: 13px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.twhen { font-size: 10.5px; font-weight: 500; line-height: 14px; color: var(--muted); margin-top: 2px; }
.task.done .tname { text-decoration: line-through; }
.task.done .tname, .task.done .twhen { opacity: 0.55; }
.tprog { display: flex; align-items: center; margin-top: 5px; }
.tprog .track { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.tprog .track span { display: block; height: 100%; background: var(--primary); }
.tprog small { font-size: 10px; color: var(--muted); margin-left: 6px; }
.badge { font-size: 9px; font-weight: 800; letter-spacing: 0.6px; border-radius: 999px; padding: 5px 10px; flex-shrink: 0; line-height: 1; }
.badge.HARD { background: var(--high-bg); color: var(--high-fg); border: 1px solid color-mix(in srgb, var(--high-fg) 28%, transparent); }
.badge.MEDIUM { background: var(--med-bg); color: var(--med-fg); border: 1px solid color-mix(in srgb, var(--med-fg) 28%, transparent); }
.badge.EASY { background: var(--low-bg); color: var(--low-fg); border: 1px solid color-mix(in srgb, var(--low-fg) 28%, transparent); }
